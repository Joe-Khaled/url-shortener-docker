<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Snip — tiny links</title>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Snip<span class="dot">.</span></h1>
        <p class="tagline">Paste a long URL, get a short one.</p>
        <div class="status" id="status">checking backend…</div>
      </header>

      <form id="shorten-form">
        <input
          id="url-input"
          type="url"
          placeholder="https://example.com/some/very/long/path"
          required
        />
        <button type="submit">Shorten</button>
      </form>
      <p class="message" id="message"></p>

      <section class="stats">
        <div><span id="total-links">–</span><label>links</label></div>
        <div><span id="total-clicks">–</span><label>clicks</label></div>
      </section>

      <section>
        <h2>Recent links</h2>
        <table>
          <thead>
            <tr><th>Short link</th><th>Destination</th><th>Clicks</th></tr>
          </thead>
          <tbody id="links-body"></tbody>
        </table>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
